name: Poll FMC Tracking Feed

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: poll-fmc
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live event feed
        run: |
          STATUS=$(curl -sS --max-time 20 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "X-Apikey: ${{ secrets.FMC_API_KEY }}" \
            -w "%{http_code}" \
            -o /tmp/live.json \
            "https://www.followmychallenge.com/live/mishigamichallenge2026/api/midwestultracycling/")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ge 400 ]; then
            echo "--- response body ---"
            cat /tmp/live.json
            exit 1
          fi

      - name: Fetch test event feed
        run: |
          STATUS=$(curl -sS --max-time 20 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "X-Apikey: ${{ secrets.FMC_API_KEY }}" \
            -w "%{http_code}" \
            -o /tmp/test.json \
            "https://www.followmychallenge.com/live/bright-midnight-2026/api/midwestultracycling/")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ge 400 ]; then
            echo "--- response body ---"
            cat /tmp/test.json
            exit 1
          fi

      - name: Update live data files
        run: |
          python3 race-dashboard/scripts/update_data.py live race-dashboard/data < /tmp/live.json

      - name: Update test data files
        run: |
          python3 race-dashboard/scripts/update_data.py test race-dashboard/data < /tmp/test.json

      - name: Commit and push
        run: |
          git config user.name "fmc-poll-bot"
          git config user.email "actions@users.noreply.github.com"
          git add race-dashboard/data
          git diff --cached --quiet || git commit -m "Update race feed data"
          git push

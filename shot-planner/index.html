<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUC 2026 — Shot Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* ── Reset ── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#051829;color:#FFFBF8;font-family:"Arial Narrow",Arial,sans-serif}
#app{display:flex;flex-direction:column;height:100vh}

/* ── Brand color tokens ── */
:root{
  --navy:#051829;
  --navy-2:#040e19;
  --navy-3:#071828;
  --border:#0d2236;
  --border-2:#1a3550;
  --text:#FFFBF8;
  --muted:#7899b0;
  --dim:#3a5570;
  --amber:#F49A0B;
  --blue:#4D94BF;
  --maroon:#A06868;
  --cream:#FFFBF8;
}

/* ── HEADER ── */
#header{background:#030f1a;border-bottom:1px solid #1a3550;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap}
.back-link{font-size:10px;font-weight:700;letter-spacing:1px;color:#3a5570;text-transform:uppercase;text-decoration:none;border:1px solid #1a3550;padding:4px 9px;border-radius:3px;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:4px}
.back-link:hover{border-color:#4D94BF;color:#4D94BF}
.back-arrow{font-style:normal;font-size:12px}
.logo{font-size:13px;font-weight:700;letter-spacing:2px;color:#FFFBF8;opacity:.85;white-space:nowrap}
.logo span{color:#F49A0B;letter-spacing:1px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl-label{font-size:10px;letter-spacing:1px;color:#7899b0;text-transform:uppercase;margin-right:2px}
.btn-group{display:flex;gap:4px}
.btn{padding:4px 10px;border-radius:3px;border:1px solid #1a3550;background:transparent;color:#7899b0;font-size:11px;font-family:"Arial Narrow",Arial,sans-serif;letter-spacing:.5px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn.active{border-color:#4D94BF;color:#4D94BF;background:rgba(77,148,191,.1)}
.btn:hover:not(.active){border-color:#2a4560;color:#FFFBF8}
.btn.crew-jack.active{border-color:#FFFBF8;color:#FFFBF8;background:rgba(255,251,248,.1)}
.btn.crew-cody.active{border-color:#4D94BF;color:#4D94BF;background:rgba(77,148,191,.12)}
.btn.crew-aaron.active{border-color:#A06868;color:#A06868;background:rgba(160,104,104,.12)}
.btn.crew-monica.active{border-color:#F49A0B;color:#F49A0B;background:rgba(244,154,11,.12)}
.btn-add{border-color:#4D94BF;color:#4D94BF;margin-left:auto}
.btn-add:hover{background:rgba(77,148,191,.1);color:#FFFBF8}
.stats{font-size:10px;color:#3a5570;letter-spacing:.5px;white-space:nowrap}

/* ── BODY SPLIT ── */
#content{display:flex;flex:1;overflow:hidden;position:relative}

/* ── SIDEBAR ── */
#sidebar{width:300px;flex-shrink:0;background:#040e19;border-right:1px solid #0d2236;display:flex;flex-direction:column;overflow:hidden}
#sidebar-header{padding:10px 12px 8px;border-bottom:1px solid #0d2236;font-size:10px;letter-spacing:1.5px;color:#3a5570;text-transform:uppercase}
#shot-list{flex:1;overflow-y:auto;scroll-behavior:smooth}
#shot-list::-webkit-scrollbar{width:4px}
#shot-list::-webkit-scrollbar-track{background:#040e19}
#shot-list::-webkit-scrollbar-thumb{background:#1a3550;border-radius:2px}
.section-header{padding:8px 12px 4px;font-size:9.5px;letter-spacing:1.5px;color:#2a4560;text-transform:uppercase;border-bottom:1px solid #071624;position:sticky;top:0;background:#040e19;z-index:1}
.shot-item{padding:8px 12px;border-bottom:1px solid #071624;cursor:pointer;transition:background .12s;display:flex;align-items:flex-start;gap:8px}
.shot-item:hover{background:#071828}
.shot-item.active{background:#0a2035;border-left:2px solid #4D94BF}
.shot-item.hidden{display:none}
.shot-prio{flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;width:14px}
.shot-info{flex:1;min-width:0}
.shot-name{font-size:11px;font-weight:700;color:#FFFBF8;line-height:1.3;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shot-meta{font-size:10px;color:#3a5570;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* race badges */
.shot-race-badge{padding:1px 5px;border-radius:2px;font-size:9px;letter-spacing:.5px;font-weight:700}
.badge-main{background:rgba(77,148,191,.18);color:#4D94BF}
.badge-mini{background:rgba(160,104,104,.18);color:#A06868}
.badge-user{background:rgba(255,251,248,.1);color:#FFFBF8}

.shot-crew-dots{display:flex;gap:3px;margin-top:3px}
.crew-dot{width:6px;height:6px;border-radius:50%;opacity:.85}
.dot-jack{background:#FFFBF8}
.dot-cody{background:#4D94BF}
.dot-aaron{background:#A06868}
.dot-monica{background:#F49A0B}

/* priority indicators (no emoji) */
.prio-diamond{display:inline-block;width:8px;height:8px;background:#F49A0B;transform:rotate(45deg);flex-shrink:0}
.prio-diamond-sm{display:inline-block;width:5px;height:5px;background:#4D94BF;transform:rotate(45deg);flex-shrink:0}
.prio-dot{display:inline-block;width:5px;height:5px;background:#2a4560;border-radius:50%;flex-shrink:0}
.prio-iconic-label{font-size:9px;font-weight:700;letter-spacing:.8px;color:#F49A0B;text-transform:uppercase}
.prio-high-label{font-size:9px;font-weight:700;letter-spacing:.8px;color:#4D94BF;text-transform:uppercase}

/* user-added shot indicator */
.user-badge{font-size:9px;letter-spacing:.5px;color:#FFFBF8;opacity:.5;font-style:italic}

/* ── MAP ── */
#map{flex:1;background:#030e1a}

/* ── DETAIL PANEL ── */
#detail{position:absolute;bottom:0;right:0;width:340px;max-height:60vh;background:#040e19;border-left:1px solid #0d2236;border-top:1px solid #0d2236;z-index:1000;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s;pointer-events:none}
#detail.open{transform:translateY(0);pointer-events:all}
#detail-header{padding:10px 12px;border-bottom:1px solid #0d2236;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-shrink:0}
#detail-title{font-size:13px;font-weight:700;color:#FFFBF8;line-height:1.3}
#detail-badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;align-items:center}
#detail-close{background:none;border:none;color:#3a5570;cursor:pointer;font-size:16px;padding:0 2px;flex-shrink:0;line-height:1}
#detail-close:hover{color:#FFFBF8}
#detail-body{overflow-y:auto;flex:1}
#detail-body::-webkit-scrollbar{width:3px}
#detail-body::-webkit-scrollbar-thumb{background:#1a3550}
.detail-section{padding:10px 12px;border-bottom:1px solid #071624}
.detail-label{font-size:9.5px;letter-spacing:1.2px;color:#3a5570;text-transform:uppercase;margin-bottom:4px}
.detail-text{font-size:11.5px;color:#b0c8d8;line-height:1.55}
.detail-note{font-size:11px;color:#7899b0;line-height:1.5;font-style:italic}
.detail-meta{display:flex;gap:12px;flex-wrap:wrap}
.detail-meta-item{font-size:11px;color:#5a7890}
.detail-meta-item strong{color:#4D94BF;font-weight:700}

/* ── CREW ASSIGNMENT ── */
.crew-section{padding:10px 12px}
.crew-label{font-size:9.5px;letter-spacing:1.2px;color:#3a5570;text-transform:uppercase;margin-bottom:8px}
.crew-buttons{display:flex;gap:8px}
.crew-btn{padding:5px 14px;border-radius:3px;border:1px solid #1a3550;background:transparent;font-size:11px;font-family:"Arial Narrow",Arial,sans-serif;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .15s;flex:1;text-align:center;color:#7899b0}
.crew-btn-jack.on{color:#FFFBF8;border-color:#FFFBF8;background:rgba(255,251,248,.1)}
.crew-btn-cody.on{color:#4D94BF;border-color:#4D94BF;background:rgba(77,148,191,.12)}
.crew-btn-aaron.on{color:#A06868;border-color:#A06868;background:rgba(160,104,104,.12)}
.crew-btn-monica.on{color:#F49A0B;border-color:#F49A0B;background:rgba(244,154,11,.12)}

/* ── SYNC STATUS ── */
#sync-status{font-size:9px;letter-spacing:.5px;color:#2a4560;padding:4px 12px;border-bottom:1px solid #071624;min-height:18px}
#sync-status.syncing{color:#4D94BF}
#sync-status.ok{color:#5a8a5a}
#sync-status.err{color:#A06868}

/* ── ADD POI MODAL ── */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(3,14,26,.85);z-index:2000;align-items:center;justify-content:center}
#modal-overlay.open{display:flex}
#modal{background:#040e19;border:1px solid #1a3550;border-radius:4px;width:420px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
#modal-header{padding:14px 16px;border-bottom:1px solid #0d2236;display:flex;align-items:center;justify-content:space-between}
#modal-title{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#FFFBF8}
#modal-close{background:none;border:none;color:#3a5570;font-size:18px;cursor:pointer;line-height:1}
#modal-close:hover{color:#FFFBF8}
#modal-body{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
#modal-body::-webkit-scrollbar{width:3px}
#modal-body::-webkit-scrollbar-thumb{background:#1a3550}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:9.5px;letter-spacing:1.2px;color:#3a5570;text-transform:uppercase}
.field input,.field textarea,.field select{background:#030e1a;border:1px solid #1a3550;border-radius:3px;color:#FFFBF8;font-family:"Arial Narrow",Arial,sans-serif;font-size:12px;padding:6px 8px;outline:none;transition:border-color .15s;resize:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#4D94BF}
.field select option{background:#040e19}
.field textarea{min-height:60px}
.field-row{display:flex;gap:12px}
.field-row .field{flex:1}
.radio-group,.check-group{display:flex;gap:8px;flex-wrap:wrap}
.radio-group label,.check-group label{display:flex;align-items:center;gap:5px;font-size:11px;color:#7899b0;cursor:pointer;letter-spacing:.3px}
.radio-group input,.check-group input{accent-color:#4D94BF}
.coords-row{display:flex;gap:8px;align-items:flex-end}
.coords-row .field{flex:1}
.btn-pick{padding:6px 10px;border:1px solid #4D94BF;background:transparent;color:#4D94BF;font-size:10px;font-family:"Arial Narrow",Arial,sans-serif;letter-spacing:.5px;border-radius:3px;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn-pick.active{background:#4D94BF;color:#051829}
.btn-pick:hover:not(.active){background:rgba(77,148,191,.1)}
#pick-hint{font-size:10px;color:#4D94BF;letter-spacing:.5px;min-height:14px}
#pick-banner{display:none;position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#040e19;border:1px solid #4D94BF;color:#4D94BF;padding:10px 20px;font-size:11px;letter-spacing:1px;border-radius:4px;z-index:3000;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.6)}
#pick-banner.active{display:block}
#pick-banner kbd{background:#4D94BF;color:#051829;padding:1px 5px;border-radius:2px;font-size:10px;font-family:"Arial Narrow",Arial,sans-serif;margin-left:8px;cursor:pointer}
.field-paste input{width:100%;font-size:11px}
#modal-footer{padding:12px 16px;border-top:1px solid #0d2236;display:flex;gap:8px;justify-content:flex-end}
.btn-cancel{padding:6px 16px;border:1px solid #1a3550;background:transparent;color:#7899b0;font-size:11px;font-family:"Arial Narrow",Arial,sans-serif;border-radius:3px;cursor:pointer}
.btn-cancel:hover{border-color:#2a4560;color:#FFFBF8}
.btn-submit{padding:6px 16px;border:1px solid #4D94BF;background:#4D94BF;color:#051829;font-size:11px;font-family:"Arial Narrow",Arial,sans-serif;font-weight:700;border-radius:3px;cursor:pointer;letter-spacing:.5px}
.btn-submit:hover{background:#5aabcf}

/* ── Leaflet overrides ── */
.leaflet-popup-content-wrapper{background:#040e19;border:1px solid #1a3550;color:#FFFBF8;border-radius:4px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.leaflet-popup-tip{background:#040e19}
.leaflet-popup-content{margin:8px 12px;font-family:"Arial Narrow",Arial,sans-serif;font-size:12px}
.leaflet-control-zoom a{background:#040e19;color:#7899b0;border-color:#1a3550}
.leaflet-control-zoom a:hover{background:#071624;color:#4D94BF}
.leaflet-control-attribution{background:rgba(3,14,26,.8);color:#2a4560;font-size:9px}
.leaflet-control-attribution a{color:#3a5570}
</style>
</head>
<body>
<div id="app">

<div id="header">
  <a class="back-link" href="../index.html"><i class="back-arrow">&#8592;</i> Crew Hub</a>
  <div class="logo">MISHIGAMI 2026 &nbsp;<span>/ SHOT PLANNER</span></div>

  <div class="controls">
    <span class="ctrl-label">Race</span>
    <div class="btn-group">
      <button class="btn active" id="btn-all" onclick="setRaceFilter('all')">Both</button>
      <button class="btn" id="btn-main" onclick="setRaceFilter('main')">Main Event</button>
      <button class="btn" id="btn-mini" onclick="setRaceFilter('mini')">Mini-Gami</button>
    </div>
  </div>

  <div class="controls">
    <span class="ctrl-label">Priority</span>
    <div class="btn-group">
      <button class="btn active" id="btn-pall" onclick="setPriorityFilter('all')">All</button>
      <button class="btn" id="btn-picomic" onclick="setPriorityFilter('iconic')">Iconic</button>
      <button class="btn" id="btn-phigh" onclick="setPriorityFilter('high')">High</button>
    </div>
  </div>

  <div class="controls">
    <span class="ctrl-label">Crew</span>
    <div class="btn-group">
      <button class="btn crew-jack" id="btn-jack" onclick="toggleCrewFilter('jack')">Jack</button>
      <button class="btn crew-cody" id="btn-cody" onclick="toggleCrewFilter('cody')">Cody</button>
      <button class="btn crew-aaron" id="btn-aaron" onclick="toggleCrewFilter('aaron')">Aaron</button>
      <button class="btn crew-monica" id="btn-monica" onclick="toggleCrewFilter('monica')">Monica</button>
    </div>
  </div>

  <button class="btn btn-add" onclick="openModal()">+ Add Location</button>
  <div class="stats" id="stats-text">Loading...</div>
</div>

<div id="content">
  <div id="sidebar">
    <div id="sidebar-header">Shot Locations</div>
    <div id="sync-status" id="sync-status"></div>
    <div id="shot-list"></div>
  </div>

  <div id="map"></div>

  <div id="detail">
    <div id="detail-header">
      <div>
        <div id="detail-title">Shot Name</div>
        <div id="detail-badges"></div>
      </div>
      <button id="detail-close" onclick="closeDetail()">&#x2715;</button>
    </div>
    <div id="detail-body">
      <div class="detail-section">
        <div class="detail-label">Miles</div>
        <div class="detail-meta" id="detail-miles"></div>
      </div>
      <div class="detail-section">
        <div class="detail-label">Direction of Travel</div>
        <div class="detail-text" id="detail-direction"></div>
      </div>
      <div class="detail-section">
        <div class="detail-label">Shot Description</div>
        <div class="detail-text" id="detail-description"></div>
      </div>
      <div class="detail-section">
        <div class="detail-label">Notes &amp; Access</div>
        <div class="detail-note" id="detail-notes"></div>
      </div>
      <div class="crew-section">
        <div class="crew-label">Assign Crew</div>
        <div class="crew-buttons">
          <button class="crew-btn crew-btn-jack" id="crew-jack" onclick="toggleCrew('jack')">Jack</button>
          <button class="crew-btn crew-btn-cody" id="crew-cody" onclick="toggleCrew('cody')">Cody</button>
          <button class="crew-btn crew-btn-aaron" id="crew-aaron" onclick="toggleCrew('aaron')">Aaron</button>
          <button class="crew-btn crew-btn-monica" id="crew-monica" onclick="toggleCrew('monica')">Monica</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ADD LOCATION MODAL -->
<div id="pick-banner">Click anywhere on the map to set coordinates <kbd onclick="togglePickMode()">Cancel</kbd></div>

<div id="modal-overlay">
  <div id="modal">
    <div id="modal-header">
      <span id="modal-title">Add Location</span>
      <button id="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div id="modal-body">
      <div class="field">
        <label>Name *</label>
        <input type="text" id="f-name" placeholder="e.g. Kenosha Lighthouse North Pier">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Section</label>
          <select id="f-section">
            <option value="Chicago Start">Chicago Start</option>
            <option value="North Shore">North Shore</option>
            <option value="Wisconsin Coast">Wisconsin Coast</option>
            <option value="Upper Peninsula">Upper Peninsula</option>
            <option value="Mackinac Bridge">Mackinac Bridge</option>
            <option value="N. Lower Peninsula">N. Lower Peninsula</option>
            <option value="Sleeping Bear">Sleeping Bear</option>
            <option value="Mid-Michigan Coast">Mid-Michigan Coast</option>
            <option value="Indiana">Indiana</option>
            <option value="Chicago Return">Chicago Return</option>
            <option value="SS Badger Ferry">SS Badger Ferry</option>
            <option value="Custom">Custom</option>
          </select>
        </div>
        <div class="field">
          <label>Priority</label>
          <div class="radio-group" style="margin-top:6px">
            <label><input type="radio" name="f-priority" value="standard" checked> Standard</label>
            <label><input type="radio" name="f-priority" value="high"> High</label>
            <label><input type="radio" name="f-priority" value="iconic"> Iconic</label>
          </div>
        </div>
      </div>
      <div class="field">
        <label>Race</label>
        <div class="check-group" style="margin-top:6px">
          <label><input type="checkbox" id="f-race-main" checked> Main Event</label>
          <label><input type="checkbox" id="f-race-mini"> Mini-Gami</label>
        </div>
      </div>
      <div class="field">
        <label>Coordinates *</label>
        <div class="field-paste">
          <input type="text" id="f-coords-paste" placeholder='Paste from Google Maps — e.g. "41.8781, -87.6298"' oninput="parseCoordsString(this.value)">
        </div>
        <div class="coords-row" style="margin-top:6px">
          <div class="field">
            <input type="number" id="f-lat" placeholder="Latitude" step="any">
          </div>
          <div class="field">
            <input type="number" id="f-lng" placeholder="Longitude" step="any">
          </div>
          <button class="btn-pick" id="btn-pick" onclick="togglePickMode()">Pick on map</button>
        </div>
        <div id="pick-hint"></div>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="f-desc" placeholder="What makes this location worth shooting?"></textarea>
      </div>
      <div class="field">
        <label>Notes &amp; Access</label>
        <textarea id="f-notes" placeholder="Parking, access, timing notes..."></textarea>
      </div>
      <div class="field">
        <label>Added by</label>
        <div class="radio-group" style="margin-top:6px">
          <label><input type="radio" name="f-added-by" value="jack" checked> Jack</label>
          <label><input type="radio" name="f-added-by" value="cody"> Cody</label>
          <label><input type="radio" name="f-added-by" value="aaron"> Aaron</label>
          <label><input type="radio" name="f-added-by" value="monica"> Monica</label>
        </div>
      </div>
    </div>
    <div id="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-submit" onclick="submitPOI()">Add Location</button>
    </div>
  </div>
</div>

</div><!-- #app -->
<script>
// =========================================================
// JSONBIN CONFIG
// =========================================================
// Shared POIs sync via JSONBin.io (free). Setup:
// 1. Create a free account at https://jsonbin.io
// 2. Dashboard → API Keys → copy your Master Key
// 3. Paste it as JSONBIN_KEY below
// 4. Create a new bin with content: {"userShots":[]}
//    (Dashboard → Bins → Create Bin)
// 5. Copy the Bin ID and paste as JSONBIN_BIN_ID below
// 6. All three crew members will share the same POIs
const JSONBIN_KEY    = '$2a$10$6nYU7Ll1VIKbAPTwEdw9XuYW/Vgy6AKXYQJmbYsPWYkPMgd6wt616';

// ─── STATE ─────────────────────────────────────────────────────
let map, mainRouteLine, miniRouteLine;
const markers = {};
let activeShot = null;
let raceFilter = 'all';
let priorityFilter = 'all';
let crewFilter = null;
let pickMode = false;
let userShots = [];

// ─── CREW ASSIGNMENTS (localStorage) ──────────────────────────
let crewAssignments = {};
function loadCrewAssignments() {
  try {
    const saved = localStorage.getItem('mucShotCrewAssignments');
    if (saved) crewAssignments = JSON.parse(saved);
  } catch(e) {}
}
function saveCrewAssignments() {
  try { localStorage.setItem('mucShotCrewAssignments', JSON.stringify(crewAssignments)); } catch(e) {}
}

// ─── JSONBIN SYNC ──────────────────────────────────────────────
function setSync(state, msg) {
  const el = document.getElementById('sync-status');
  el.className = state;
  el.textContent = msg;
}

async function loadUserShots() {
  if (!JSONBIN_KEY || !JSONBIN_BIN_ID) {
    // Try localStorage fallback
    try {
      const saved = localStorage.getItem('mucUserShots');
      if (saved) userShots = JSON.parse(saved);
    } catch(e) {}
    return;
  }
  setSync('syncing', 'Syncing locations...');
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    const data = await res.json();
    userShots = (data.record && data.record.userShots) ? data.record.userShots : [];
    localStorage.setItem('mucUserShots', JSON.stringify(userShots));
    setSync('ok', `${userShots.length} custom location${userShots.length !== 1 ? 's' : ''} loaded`);
  } catch(e) {
    setSync('err', 'Sync unavailable — using local data');
    try {
      const saved = localStorage.getItem('mucUserShots');
      if (saved) userShots = JSON.parse(saved);
    } catch(e2) {}
  }
}

async function saveUserShots() {
  localStorage.setItem('mucUserShots', JSON.stringify(userShots));
  if (!JSONBIN_KEY || !JSONBIN_BIN_ID) return;
  setSync('syncing', 'Saving...');
  try {
    await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify({ userShots })
    });
    setSync('ok', `${userShots.length} custom location${userShots.length !== 1 ? 's' : ''} saved`);
  } catch(e) {
    setSync('err', 'Save failed — stored locally');
  }
}

function allShots() {
  return [...SHOTS, ...userShots];
}

// ─── MAP INIT ─────────────────────────────────────────────────
function initMap() {
  loadCrewAssignments();

  map = L.map('map', {
    center: [43.5, -86.5],
    zoom: 6,
    zoomControl: true,
    attributionControl: true
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  // Route lines
  mainRouteLine = L.polyline(MAIN_ROUTE, { color: '#4D94BF', weight: 2, opacity: .55 }).addTo(map);
  miniRouteLine = L.polyline(MINI_ROUTE, { color: '#A06868', weight: 2, opacity: .55, dashArray: '6 4' }).addTo(map);

  // Map click handler for pick mode
  map.on('click', function(e) {
    if (!pickMode) return;
    document.getElementById('f-lat').value = e.latlng.lat.toFixed(6);
    document.getElementById('f-lng').value = e.latlng.lng.toFixed(6);
    document.getElementById('f-coords-paste').value = '';
    togglePickMode(); // exits pick mode and restores modal
    document.getElementById('pick-hint').textContent = 'Coordinates set. Adjust if needed.';
  });

  // Load built-in shots
  SHOTS.forEach(shot => {
    const marker = createMarker(shot);
    markers[shot.id] = marker;
    marker.addTo(map);
  });

  loadUserShots().then(() => {
    userShots.forEach(shot => {
      const marker = createMarker(shot);
      markers[shot.id] = marker;
      marker.addTo(map);
    });
    renderSidebar();
    updateStats();
  });
}

// ─── MARKER ICONS ─────────────────────────────────────────────
function getMarkerIcon(shot) {
  const isIconic = shot.priority === 'iconic';
  const isHigh   = shot.priority === 'high';
  const isUser   = !!shot.userAdded;

  let color;
  if (isUser) {
    color = '#FFFBF8';
  } else if (shot.races.length > 1) {
    color = '#FFFBF8'; // both races — cream/white stands out
  } else if (shot.races[0] === 'mini') {
    color = '#A06868';
  } else {
    color = '#4D94BF';
  }

  const size = isIconic ? 18 : 10;
  const glowStyle = isIconic
    ? `box-shadow:0 0 10px ${color},0 0 0 2px ${color},0 2px 8px rgba(0,0,0,.5);`
    : 'box-shadow:0 0 0 1px rgba(0,0,0,.6),0 1px 4px rgba(0,0,0,.5);';

  // Iconic: diamond shape; others: circle
  const shape = isIconic
    ? `border-radius:2px;transform:rotate(45deg);`
    : `border-radius:50%;`;

  return L.divIcon({
    className: '',
    html: `<div style="
      width:${size}px;height:${size}px;
      background:${color};
      border:${isIconic ? '2px' : '1.5px'} solid #051829;
      ${shape}
      ${glowStyle}
      cursor:pointer;
    "></div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2]
  });
}

function createMarker(shot) {
  const marker = L.marker(shot.coords, { icon: getMarkerIcon(shot) });
  marker.on('click', () => selectShot(shot.id));
  return marker;
}

function refreshMarkerIcon(shotId) {
  const shot = allShots().find(s => s.id === shotId);
  if (shot && markers[shotId]) markers[shotId].setIcon(getMarkerIcon(shot));
}

// ─── SIDEBAR ──────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('shot-list');
  const sections = {};

  allShots().forEach(shot => {
    const sec = shot.section || 'Custom';
    if (!sections[sec]) sections[sec] = [];
    sections[sec].push(shot);
  });

  let html = '';
  Object.entries(sections).forEach(([section, shots]) => {
    const sectionShots = shots.filter(s => isVisible(s));
    if (sectionShots.length === 0) return;
    html += `<div class="section-header">${section} (${sectionShots.length})</div>`;
    shots.forEach(shot => {
      const crew = crewAssignments[shot.id] || [];
      const visible = isVisible(shot);
      const isActive = activeShot === shot.id;

      const raceBadges = shot.races.map(r =>
        `<span class="shot-race-badge badge-${r}">${r === 'main' ? 'MAIN' : r === 'mini' ? 'MINI' : r.toUpperCase()}</span>`
      ).join('');

      const mileText = Object.entries(shot.miles || {})
        .map(([r, m]) => `mi ${m}`)
        .join(' / ');

      const crewDots = crew.map(c => `<div class="crew-dot dot-${c}"></div>`).join('');

      // Priority indicator — no emoji
      let prioHtml;
      if (shot.priority === 'iconic') {
        prioHtml = `<span class="prio-diamond"></span>`;
      } else if (shot.priority === 'high') {
        prioHtml = `<span class="prio-diamond-sm"></span>`;
      } else {
        prioHtml = `<span class="prio-dot"></span>`;
      }

      const userTag = shot.userAdded ? `<span class="user-badge">+ added</span>` : '';

      html += `<div class="shot-item ${isActive ? 'active' : ''} ${!visible ? 'hidden' : ''}"
        id="shot-item-${shot.id}"
        onclick="selectShot('${shot.id}')">
        <div class="shot-prio">${prioHtml}</div>
        <div class="shot-info">
          <div class="shot-name">${shot.name}</div>
          <div class="shot-meta">
            ${raceBadges}
            ${userTag}
            <span style="color:#2a4560">${mileText}</span>
          </div>
          <div class="shot-crew-dots">${crewDots}</div>
        </div>
      </div>`;
    });
  });

  list.innerHTML = html;
}

// ─── VISIBILITY ───────────────────────────────────────────────
function isVisible(shot) {
  if (raceFilter !== 'all' && !shot.races.includes(raceFilter)) return false;
  if (priorityFilter !== 'all' && shot.priority !== priorityFilter) return false;
  if (crewFilter) {
    const crew = crewAssignments[shot.id] || [];
    if (!crew.includes(crewFilter)) return false;
  }
  return true;
}

function updateMarkerVisibility() {
  allShots().forEach(shot => {
    const marker = markers[shot.id];
    if (!marker) return;
    if (isVisible(shot)) {
      if (!map.hasLayer(marker)) marker.addTo(map);
    } else {
      if (map.hasLayer(marker)) map.removeLayer(marker);
    }
  });

  if (raceFilter === 'mini') {
    if (map.hasLayer(mainRouteLine)) map.removeLayer(mainRouteLine);
    if (!map.hasLayer(miniRouteLine)) miniRouteLine.addTo(map);
  } else if (raceFilter === 'main') {
    if (!map.hasLayer(mainRouteLine)) mainRouteLine.addTo(map);
    if (map.hasLayer(miniRouteLine)) map.removeLayer(miniRouteLine);
  } else {
    if (!map.hasLayer(mainRouteLine)) mainRouteLine.addTo(map);
    if (!map.hasLayer(miniRouteLine)) miniRouteLine.addTo(map);
  }
}

function updateStats() {
  const visible = allShots().filter(s => isVisible(s));
  const assigned = visible.filter(s => (crewAssignments[s.id] || []).length > 0);
  const iconic = visible.filter(s => s.priority === 'iconic');
  document.getElementById('stats-text').textContent =
    `${visible.length} shots · ${iconic.length} iconic · ${assigned.length} assigned`;
}

// ─── SELECTION ────────────────────────────────────────────────
function selectShot(id) {
  if (pickMode) return;
  activeShot = id;
  const shot = allShots().find(s => s.id === id);
  if (!shot) return;

  map.panTo(shot.coords, { animate: true });

  document.querySelectorAll('.shot-item').forEach(el => el.classList.remove('active'));
  const item = document.getElementById(`shot-item-${id}`);
  if (item) {
    item.classList.add('active');
    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  showDetail(shot);
}

function showDetail(shot) {
  const panel = document.getElementById('detail');
  const crew = crewAssignments[shot.id] || [];

  document.getElementById('detail-title').textContent = shot.name;

  // Badges
  const raceBadges = shot.races.map(r =>
    `<span class="shot-race-badge badge-${r}">${r === 'main' ? 'MAIN EVENT' : r === 'mini' ? 'MINI-GAMI' : r.toUpperCase()}</span>`
  ).join(' ');

  let prioBadge = '';
  if (shot.priority === 'iconic') {
    prioBadge = `<span class="prio-iconic-label">&#9670; Iconic</span>`;
  } else if (shot.priority === 'high') {
    prioBadge = `<span class="prio-high-label">&#9670; High Priority</span>`;
  }
  const userBadge = shot.userAdded ? `<span class="user-badge">+ crew added by ${shot.addedBy || '?'}</span>` : '';

  document.getElementById('detail-badges').innerHTML = raceBadges + ' ' + prioBadge + ' ' + userBadge;

  const milesHtml = Object.entries(shot.miles || {}).map(([race, m]) =>
    `<span class="detail-meta-item"><strong>Mile ${m}</strong> (${race === 'main' ? 'Main Event' : 'Mini-Gami'})</span>`
  ).join('');
  document.getElementById('detail-miles').innerHTML = milesHtml || '<span style="color:#2a4560">—</span>';

  document.getElementById('detail-direction').textContent = shot.direction || '—';
  document.getElementById('detail-description').textContent = shot.description || '—';
  document.getElementById('detail-notes').textContent = shot.notes || '—';

  ['jack', 'cody', 'aaron', 'monica'].forEach(name => {
    document.getElementById(`crew-${name}`).classList.toggle('on', crew.includes(name));
  });

  panel.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
  activeShot = null;
  document.querySelectorAll('.shot-item').forEach(el => el.classList.remove('active'));
}

// ─── CREW ASSIGNMENT ──────────────────────────────────────────
function toggleCrew(name) {
  if (!activeShot) return;
  if (!crewAssignments[activeShot]) crewAssignments[activeShot] = [];
  const idx = crewAssignments[activeShot].indexOf(name);
  if (idx >= 0) {
    crewAssignments[activeShot].splice(idx, 1);
  } else {
    crewAssignments[activeShot].push(name);
  }
  saveCrewAssignments();

  const btn = document.getElementById(`crew-${name}`);
  btn.classList.toggle('on', crewAssignments[activeShot].includes(name));

  const item = document.getElementById(`shot-item-${activeShot}`);
  if (item) {
    const dotsEl = item.querySelector('.shot-crew-dots');
    const crew = crewAssignments[activeShot] || [];
    dotsEl.innerHTML = crew.map(c => `<div class="crew-dot dot-${c}"></div>`).join('');
  }

  if (crewFilter) {
    updateMarkerVisibility();
    updateStats();
  }
}

// ─── FILTERS ──────────────────────────────────────────────────
function setRaceFilter(val) {
  raceFilter = val;
  ['all', 'main', 'mini'].forEach(v => {
    document.getElementById(`btn-${v}`).classList.toggle('active', v === val);
  });
  updateMarkerVisibility();
  renderSidebar();
  updateStats();
}

function setPriorityFilter(val) {
  priorityFilter = val;
  [['all','pall'],['iconic','picomic'],['high','phigh']].forEach(([v, id]) => {
    document.getElementById(`btn-${id}`).classList.toggle('active', v === val);
  });
  updateMarkerVisibility();
  renderSidebar();
  updateStats();
}

function toggleCrewFilter(name) {
  crewFilter = crewFilter === name ? null : name;
  ['jack', 'cody', 'aaron', 'monica'].forEach(n => {
    document.getElementById(`btn-${n}`).classList.toggle('active', n === crewFilter);
  });
  updateMarkerVisibility();
  renderSidebar();
  updateStats();
}

// ─── ADD LOCATION MODAL ───────────────────────────────────────
function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  // Reset form
  document.getElementById('f-name').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('f-lat').value = '';
  document.getElementById('f-lng').value = '';
  document.getElementById('f-coords-paste').value = '';
  document.getElementById('f-race-main').checked = true;
  document.getElementById('f-race-mini').checked = false;
  document.querySelector('input[name="f-priority"][value="standard"]').checked = true;
  document.querySelector('input[name="f-added-by"][value="jack"]').checked = true;
  document.getElementById('pick-hint').textContent = '';
  if (pickMode) togglePickMode();
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  if (pickMode) togglePickMode();
}

function togglePickMode() {
  pickMode = !pickMode;
  const btn = document.getElementById('btn-pick');
  const banner = document.getElementById('pick-banner');
  const overlay = document.getElementById('modal-overlay');

  if (pickMode) {
    // Hide modal, show banner so the map is clickable
    overlay.classList.remove('open');
    banner.classList.add('active');
    map.getContainer().style.cursor = 'crosshair';
    btn.classList.add('active');
  } else {
    // Restore modal, hide banner
    banner.classList.remove('active');
    overlay.classList.add('open');
    map.getContainer().style.cursor = '';
    btn.classList.remove('active');
  }
}

function parseCoordsString(val) {
  // DMS format: 42°06'47.7"N 88°01'47.5"W (Google Maps right-click on some views)
  const dms = val.match(/(\d+)°(\d+)'([\d.]+)"([NS])[,\s]+(\d+)°(\d+)'([\d.]+)"([EW])/);
  if (dms) {
    const lat = (parseFloat(dms[1]) + parseFloat(dms[2])/60 + parseFloat(dms[3])/3600) * (dms[4]==='S' ? -1 : 1);
    const lng = (parseFloat(dms[5]) + parseFloat(dms[6])/60 + parseFloat(dms[7])/3600) * (dms[8]==='W' ? -1 : 1);
    document.getElementById('f-lat').value = lat.toFixed(6);
    document.getElementById('f-lng').value = lng.toFixed(6);
    document.getElementById('pick-hint').textContent = 'Coordinates parsed.';
    return;
  }
  // Decimal format: 41.8781, -87.6298
  const decimal = val.match(/(-?\d+\.?\d*)[,\s]+(-?\d+\.?\d*)/);
  if (decimal) {
    document.getElementById('f-lat').value = parseFloat(decimal[1]).toFixed(6);
    document.getElementById('f-lng').value = parseFloat(decimal[2]).toFixed(6);
    document.getElementById('pick-hint').textContent = 'Coordinates parsed.';
  } else {
    document.getElementById('pick-hint').textContent = '';
  }
}

function submitPOI() {
  const name = document.getElementById('f-name').value.trim();
  const lat  = parseFloat(document.getElementById('f-lat').value);
  const lng  = parseFloat(document.getElementById('f-lng').value);

  if (!name) { alert('Please enter a name.'); return; }
  if (isNaN(lat) || isNaN(lng)) { alert('Please set coordinates (use "Pick on map" or enter manually).'); return; }

  const races = [];
  if (document.getElementById('f-race-main').checked) races.push('main');
  if (document.getElementById('f-race-mini').checked)  races.push('mini');
  if (races.length === 0) races.push('main');

  const priority  = document.querySelector('input[name="f-priority"]:checked').value;
  const addedBy   = document.querySelector('input[name="f-added-by"]:checked').value;
  const section   = document.getElementById('f-section').value;
  const desc      = document.getElementById('f-desc').value.trim();
  const notes     = document.getElementById('f-notes').value.trim();

  const newShot = {
    id:        'u-' + Date.now(),
    races,
    section,
    name,
    coords:    [lat, lng],
    priority,
    miles:     {},
    direction: '',
    description: desc,
    notes,
    userAdded: true,
    addedBy
  };

  userShots.push(newShot);
  saveUserShots();

  // Add to map and sidebar
  const marker = createMarker(newShot);
  markers[newShot.id] = marker;
  if (isVisible(newShot)) marker.addTo(map);

  renderSidebar();
  updateStats();
  closeModal();

  // Pan to new location and select it
  setTimeout(() => selectShot(newShot.id), 100);
}

// ─── INIT ─────────────────────────────────────────────────────
window.addEventListener('load', initMap);
